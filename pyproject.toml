[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elbench"
version = "0.1.0"
description = "Config-driven benchmark framework for education LLM evaluation."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "nltk>=3.8",
    "latex2sympy2_extended>=1.10.1",
    "openpyxl>=3.1.0",
    "pylatexenc>=2.10",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.0",
    "sympy>=1.13.0",
    "word2number>=1.1",
]

[project.optional-dependencies]
basic-education = [
    "aiosqlite>=0.20.0",
    "click>=8.1.0",
    "grandalf>=0.8",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.4.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "matplotlib>=3.8.0",
    "pandas>=2.2.0",
    "polyfactory>=2.16.0",
    "pyppeteer>=2.0.0",
    "tenacity>=9.0.0",
    "tqdm>=4.66.0",
    "typing-extensions>=4.12.0",
]
dev = [
    "pytest>=8.0.0",
]
dashboard = [
    "gradio==6.4.0",
    "plotly>=5.20.0",
]

[project.scripts]
elbench = "elbench.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"elbench.basic_education_runtime.assets.fonts" = ["*.ttf"]
"elbench.dashboard" = ["*.json"]
